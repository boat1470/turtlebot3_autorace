---
# arx_mission's detect_intersection_sign. See light.yaml for why every
# detector gets its own file rather than sharing one /**: key.
/**:
  ros__parameters:
    sign:
      # Which signs this node looks for. Each one names the mission that has
      # to be armed before it is considered, the number it publishes on
      # /detect/traffic_sign, and the file to match against.
      #
      # Signs sharing a mission are alternatives: the best scoring one wins
      # and the rest are dropped, which is what stops a frame that matches
      # both arrows from publishing both.
      #
      # The values keep the numbers the example's own Enum produced
      # (construction 1, left 2, right 3) so its tooling still reads them.
      names: [left, right, construction, parking, tunnel]

      # Read by colour, not SIFT (method: arrow - see sign.arrow below and
      # fnReadArrow). Where the robot sees the junction board the disc is
      # about 15 px across, and SIFT found nothing on it (2026-10-23: 0
      # inliers with the new references, 4 on the wall with the old ones),
      # while the colour reader read it, and left_frame.png / right_frame.png,
      # all correctly. The png is then only drawn on the debug image.
      # method: sift puts them back on SIFT, with the shared min_inliers (4):
      # a raised arm gave 15-16 inliers from the start line, and run
      # 1023_1044 confirmed "left" on five 4-inlier matches before the arm
      # was up - min_inliers: 8 separates those.
      left:
        mission: 2
        value: 2
        image: left.png
        method: arrow
      right:
        mission: 2
        value: 3
        image: right.png
        method: arrow
      construction:
        mission: 3
        value: 1
        image: construction.png
      # 4, not the 1 the example's own Enum gives it. Every sign detector
      # over there has its own Enum starting at 1, so its parking sign and
      # its construction board are both 1 - which is fine when they are
      # different nodes and not fine here.
      parking:
        mission: 4
        value: 4
        image: parking.png
      # The board in front of the tunnel. It only counts once it looks at
      # least min_width_px wide - that is what says the robot has reached
      # the tunnel rather than just seen it. tunnel.png is autorace_idminer's
      # for now; cut one from this robot's camera if it matches badly.
      #
      # 2026-10-17: tunnel.png is the real board now, cut from
      # image/frames/tunnel_frame.png (320x240). In that frame the board is
      # 61 px wide, 19/32 inliers, and already near the left edge - closer in
      # it leaves the picture before it gets much bigger, so this cannot be
      # set far above what that frame gives. 55 leaves room for jitter.
      #
      # To re-measure: stand the robot where it should stop, run detect_sign
      # with always_on:=true, and read `width` off the log (or the box on
      # /detect/image_traffic_sign - red is matched but still too small).
      tunnel:
        mission: 6
        value: 5
        image: tunnel.png
        min_width_px: 55.0
        # Off for this one. sign.max_mse grows with how big the board looks
        # and how far it sits from the top-left of the frame, so it rejects
        # exactly the close, big board this sign is waiting for. The RANSAC
        # inliers, the width and the not-mirrored check do the job instead.
        max_mse: 0.0
        # Measured on the real robot 2026-10-17. Real views of the board
        # gave 11-21 inliers at 55-83 px; the false ones that stopped a run
        # gave 4-6 inliers and boxes 144 and 359 px wide - wider than the
        # 320 px frame. The board leaves the picture long before 200 px.
        min_inliers: 8
        max_width_px: 200.0

      # Good matches a reference image needs before it is considered at all.
      # The original wrote `len(good) > MIN_MATCH_COUNT` with MIN_MATCH_COUNT
      # set to 5, so its real threshold was six; this is that number, spelt
      # the way it behaves.
      min_match_count: 6

      # Despite the name in the original, this is not a measure of how well
      # the sign matched. fnCalcMSE compares the keypoints' camera-frame
      # coordinates against their coordinates in the reference image, which
      # is 92x112 - so it rejects a sign that is far from the top-left of the
      # frame, and its useful value changes with camera resolution.
      #
      # Kept at the original number because the camera is unchanged. Raise it
      # if the detector goes quiet on a sign that rqt_image_view shows is
      # plainly matching.
      max_mse: 70000.0

      # RANSAC inliers the match must survive on. A frame can otherwise pass
      # min_match_count and max_mse with every match rejected as an outlier,
      # which means they were scattered across the picture rather than
      # describing one sign. A run through the junction reported
      # "Detect right sign (0 inliers)" three times and outvoted the one
      # report with real support behind it, on a course whose only arrow is
      # the left one.
      #
      # Four is a floor, not a tuning knob: a homography is fitted from four
      # points, so fewer than four inliers means no consistent model was
      # found at all. Raise it to demand a stronger sign.
      min_inliers: 4

      # SIFT over the whole frame is the most expensive thing in this stack,
      # which is why this started at the original's 2-in-3 drop. Measured on
      # the construction board, that drop is what stopped the mission
      # confirming - not the matching, which worked:
      #
      #   Detect construction sign (4 inliers, score 0.027, mse 32619)
      #   Detect construction sign (5 inliers, score 0.033, mse 16180)   +0.72 s
      #   Detect construction sign (5 inliers, score 0.033, mse 25233)   +4.20 s
      #
      # confirm_votes 5 within vote_max_age_s 3.0 is 1.67 reports a second.
      # The camera runs at 8.4 Hz, so at 3 the detector only looks at 2.8
      # frames a second and 60% of them would have to match. 3 reports in
      # 4.2 s is a 25% hit rate, so the third report arrived with the first
      # two already expired and the count never climbed above 2.
      #
      # At 1 the same 25% gives 2.1 reports a second, which clears 1.67.
      # Raising the hit rate is the honest fix here; relaxing confirm_votes
      # would have confirmed on weaker evidence instead.
      #
      # This is the same change lane.frame_skip took, for the same reason.
      # Only measured in simulation. On a Pi 4 this is SIFT on every frame
      # and has to be timed before it is trusted - it is bounded by the
      # arming gate, which keeps the detector idle outside its own mission.
      frame_skip: 1
      publish_debug_image: true
      always_on: false

      # The colour reader for signs with method: arrow (fnReadArrow). All
      # read every frame - `ros2 param set /arx_detect_sign sign.arrow.<key>`.
      # Tried on /camera/image_compensated, 2026-10-23, camera 30000 / 9.0.
      arrow:
        hue_l: 80          # blue, OpenCV H 0-179
        hue_h: 130
        sat_l: 50
        val_l: 40
        sat_h: 255         # upper ends, there in case they are ever wanted -
        val_h: 255         # leave at 255: a bluer, brighter disc is only clearer
        min_area: 40.0     # px^2 of the blue blob; the far disc was 170
        max_area: 4000.0
        min_round: 0.50    # min side / max side; the lowered arm is ~0.6
        min_white: 6       # white px inside the disc; the far disc had 37
        white_delta: 25.0  # white = this much brighter than the disc's mean
        min_offset_px: 1.0 # |head x - stem x|; the far discs had 2.8 (left), 1.6 (right)
        roi_y_min: 0.3     # search band, fractions of the height from the top:
        roi_y_max: 0.8     # rows above min and below max are blanked (0 / 1 = all)

      # Empty means arx_mission's own image/ directory, whose README explains
      # why the ones in turtlebot3_autorace_detect are not used here. Set this
      # to a path to swap in a set cut on practice day.
      image_dir: ''
