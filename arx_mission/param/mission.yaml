---
# arx_mission_control and arx_control_lane. No detector reads this file, so
# the /**: key collides with nothing.
/**:
  ros__parameters:
    rate_hz: 10.0

    # Hold the start until detect_lane keeps up (2026-11-01). Launched with
    # Nav2 it ran at 3-17 frames/s for the first 3-4 s, and the robot weaved
    # down the start straight, once 19 deg off before 1A (run 1101_1045).
    # min_lane_hz of /detect/lane_state over the last lane_hz_hold_s, then
    # off; past give_up_s it goes anyway. min_lane_hz 0 turns it off.
    start:
      min_lane_hz: 25.0
      # 3 s with no gap over 100 ms, 2026-11-01: 2 s at 25 Hz still let the
      # robot off with gaps of 120-290 ms to come in the first 3 s of driving
      # (runs 1448, 1451, 1456), each one a lurch in the steering.
      # 70 not 100: run 1507 passed with six gaps of 83-100 ms in its window
      # and lost the lane for 133 ms a second after setting off. A settled
      # stream's longest gap is 50-69 ms; replayed on seven runs, 70 waits
      # at most ~11 s from the first lane message.
      lane_hz_hold_s: 3.0
      # Beep on the OpenCR when the warm-up above is over (turtlebot3_node's
      # /sound): 0 none, 1 on, 2 low battery, 3 error, 4/5 button. 2026-11-04.
      sound: 3
      max_lane_gap_ms: 70.0
      give_up_s: 30.0

    light:
      enabled: true #เริ่มโดยการรอไฟแดงไหม  - true 2026-11-03: the competition starts on the light
      # Frames of green, not ticks. Three frames at 10 fps is 0.3 s.
      confirm_frames: 3
      # Act on the change to green, not on a green that was already burning
      # when the stack came up. Green lasts five seconds and the rules fail
      # the mission for crossing the start line on any other signal, so
      # joining a green with a second left would mean crossing on red. In
      # simulation the light cycles from t=0 regardless, which puts roughly
      # five starts in eleven mid-green. A real cycle is expected to begin at
      # red, where this costs nothing.
      require_transition: true
      # The official clock starts at the first green whether or not the robot
      # moves, so a light that cannot be seen must still end in driving off.
      # Missing this mission costs 20 points; never starting costs the run.
      # Counted from detect_lane being steady (the start.* warm-up above),
      # not from the launch - 2026-11-04.
      give_up_s: 25.0

    intersection:
      enabled: true
      # A majority of the last `window` reports rather than a run of
      # identical ones. Per-frame accuracy against the left board was
      # measured at 76%, with the wrong answers scattered among the right
      # ones - so a run of three identical reports can take seconds to turn
      # up while a majority settles at once. See the note in
      # mission_control.py.
      window: 7
      confirm_votes: 5

      # How old a report may be and still count. Without this the window is
      # seven reports however far apart they arrived: one run voted on
      # reports fourteen seconds apart, by which time the robot was metres
      # past the junction looking at something else.
      vote_max_age_s: 3.0

      # Stop where the arrow was identified instead of acting on it.
      #
      # 🔴 ON, for bench testing on the real robot. A run with this true stops
      # at the junction and stays there, which fails the mission. Put it back
      # to false before anything that is meant to score.
      #
      # With this false the robot carries on and steers by the line the arrow
      # chose - yellow for left, white for right - for the rest of the run.
      # That is the finished behaviour, and it was off while that was being
      # worked on: driving on showed the chosen line is often not yet in frame
      # at the moment the arrow is confirmed, so the steering falls straight
      # back to the mean of both lines and no branch is taken. Stopping here is
      # how to see what the camera actually has at that point, and on the real
      # robot it is also the first question - does it see the sign at all.
      stop_after_detect: false #

      # Left arrow only (2026-10-24): right reports are not counted. Left on
      # confirm_votes left reports; facing right_at_deg (turning left, in the
      # heading gate) with fewer, it is taken as right and the right arc runs
      # as before. The far right arm is a 7-10 px disc, read too seldom
      # (1023_2324) or the lowered left arm read in its place (1023_2258).
      left_only:
        enabled: true
        confirm_votes: 3
        right_at_deg: 155.0

      # Distance from the start line to the intersection sign is under two
      # metres, which at 0.05 m/s is about 40 s of driving. This is measured
      # from the moment the robot is released, not from the sign coming into
      # view, so it has to cover the whole approach.
      give_up_s: 90.0

      # What the arrow is used for once it has been read.
      #
      # false: only to decide which way to turn. The turn puts the robot into
      # the branch and lane following carries on as it does everywhere else -
      # whatever lane the robot now points into is the lane it follows.
      #
      # true also pins detect_lane to that side's line for the rest of the
      # run. Measured on this course that steers by `line + 280`, and 280 is
      # half a lane width, so it aims at the middle of the lane rather than
      # at the line: a 0.41 m turning radius needing 0.64 m of travel to come
      # round 90 degrees, which the junction does not give it.
      follow_chosen_line: true

      # A right arrow, after its turn, until the construction sign: true =
      # the white line alone (white - half_lane_px), false = auto, the mean
      # of both lines. Only means anything with follow_chosen_line true -
      # false there is auto for both arrows already. The left arrow has its
      # own switch, left_script.follow_yellow_after.
      right_follow_white_after: false

      # A left arrow is driven by a fixed script instead of `turn` below
      # (2026-10-11): on the real course the yellow line of the left branch
      # is not in frame where the arrow is confirmed, so there is nothing to
      # follow yet. In order:
      #
      #   1. turn on the spot to face heading_deg
      #   2. forward first_m
      #   3. turn turn_deg on the spot (+ is left)
      #   4. forward second_m
      #
      # then steer by the yellow line whatever follow_chosen_line says.
      # A right arrow still uses `turn`.
      #
      # heading_deg is a world angle, 0 = the way the robot faced when
      # robot.launch.py came up - so bring the robot up on the start line,
      # facing along it, or this heading means something else.
      # The quicker left turn (2026-10-13): on a left arrow, hold one fixed
      # arc - speed and rate - until detect_lane has both lines of the
      # branch (lane_state 2 for both_ticks ticks) or timeout_s is up, then
      # follow the lane by both lines. Takes precedence over left_script
      # below, which took 18 s. speed 0.14 at rate 0.8 is a 0.175 m radius,
      # 92 degrees in 2 s, with the outer wheel at 0.204 m/s - about as
      # fast as the 0.22 wheel limit allows on this radius. Too tight at
      # the end (hugging the inner yellow): rate 0.7.
      left_arc:
        enabled: true
        speed: 0.14          # m/s
        # 0.8 (R 0.175) ended the arc 56 px / 38 mm left of the lane centre
        # on 2026-10-13 - inside the 42 mm margin, lane following pulled it
        # back in 2 s. 0.7 is R 0.20, 80 degrees in 2 s, the rest to the lane.
        rate: 0.7            # rad/s, + is left
        # 2.5 on 2026-10-14 (was 2.0): run 1014_2239 timed out at 2.0 with
        # lane_state 0, stood 0.4 s, and had both lines at 2.45 s.
        timeout_s: 2.5
        both_ticks: 3
        min_s: 0.5           # do not hand over before this, even with both lines
      # The same for a right arrow, mirrored: the arc turns right. Same
      # numbers to start with - the right branch leaves the junction on the
      # same 0.25 m radius - but not yet measured on the course.
      right_arc:
        enabled: true
        speed: 0.14
        # 0.7 (R 0.20) was too tight on the course, 2026-10-13. Plain lane
        # following instead turned 5B at R 0.33 - only 55 degrees before
        # the far row saw 6A and pulled left - cutting inside 5B. 0.55 is
        # R 0.25, the course's own radius; 2.5 s is 79 degrees.
        rate: 0.55           # rad/s, magnitude - R 0.25
        timeout_s: 2.5
        # First beat: the right arrow is confirmed while still in the left
        # curve before the junction (2A). Carry on round, on this arc, to
        # align_heading_deg (odom), then turn right. Whatever the dial in
        # lane_debug reads when the robot points straight up the junction
        # is the number to put here.
        align: true
        align_heading_deg: 180.0
        align_tolerance_deg: 15.0
        align_speed: 0.14
        align_rate: 0.7      # rad/s, magnitude; turns whichever way is shorter
        align_timeout_s: 2.0
        # Second beat: straight in on that heading, into the junction, before
        # the right turn. 0 skips it.
        straight_m: 0.00
        straight_speed: 0.14
        straight_timeout_s: 3.0
        # End the right arc at this odom heading; timeout_s then only backs
        # it up. Same angle however late the sign was confirmed.
        use_end_heading: false
        end_heading_deg: -75.0
        # After the arc, steer by the white line instead of both until odom
        # crosses hug_until_deg turning hug_release_turn, then both lines
        # again (2026-10-13). The right branch passes 180 twice: halfway
        # round 6A turning left, and halfway round 7A turning right -
        # 'right' lets go in 7A, 'left' in 6A. hug_timeout_s is the backstop.
        hug_white: false     # off 2026-10-13: both lines after the arc
        hug_until_deg: 180.0
        hug_release_turn: right
        hug_timeout_s: 25.0


        both_ticks: 3
        min_s: 0.5
      # The fixed four-move version. Only used when left_arc is off.
      left_script:
        enabled: false
        heading_deg: 180.0
        heading_tolerance_deg: 3.0
        first_m: 0.30
        turn_deg: 90.0
        second_m: 0.0
        rate: 0.4            # rad/s on the spot
        speed: 0.05          # m/s on the straights
        slow_within_deg: 10.0
        # Per step: a step that has not finished by then is skipped.
        step_give_up_s: 15.0
        # Stop where the script ends instead of following the yellow line -
        # to see where the four moves actually put the robot. The robot
        # stays stopped, which fails the run: false before anything scored.
        stop_after: false
        # What to steer by once the script is done, until the construction
        # sign: true = the yellow line alone (yellow + half_lane_px), false =
        # auto, the mean of both lines, one line + half_lane_px when only
        # one is in view.
        follow_yellow_after: true

      turn:
        # How far to turn once the arrow is known, per side. Positive is
        # counter-clockwise, so a left arrow is positive and a right one
        # negative. Two separate numbers because the junction is not
        # symmetric.
        #
        # A fixed amount of rotation, not a heading to reach and not "turn
        # until the line looks right". Both were tried. Aiming at a heading
        # needs the one the robot set off with, which is only right while
        # this node has been up since the start. Waiting on the lane detector
        # cannot tell a line that is merely visible from one that is usable:
        # it handed over while the yellow fit still sat in the middle of the
        # frame, `line + 280` put the steering target at 714 of 1000, and the
        # robot turned right into the wrong branch while reporting
        # lane_state 1 the whole way.
        enabled: false
        left_deg: 0.0
        right_deg: 0.0

        rate: 0.4            # rad/s
        speed: 0.0           # m/s while turning; 0 turns on the spot
        # Ease in over the last stretch so a tick cannot overshoot by much -
        # 0.4 rad/s at 10 Hz is 2.3 deg a tick. Capped at half the turn, so a
        # 5 degree turn is not spent entirely crawling.
        slow_within_deg: 10.0

        # Only a backstop now the turn has a definite size: it catches
        # odometry that never arrives.
        give_up_s: 20.0

      heading:
        # Absolute heading, straight off /odom. Measured on a running stack,
        # /odom's yaw is the same number gz reports for the world - only its
        # position counts from the spawn point, and that frame is translated
        # without being rotated.
        #
        # 180 +/- 45 is "facing west, give or take". The arrow board is
        # 0.12 m wide and 0.025 m thick, turned -90 degrees in the world
        # file, so its broad faces are normal to the world x axis:
        #
        #   looking along y (how the robot sets off)  12 px of edge, never matched
        #   looking along x                           22-93 px of face, 27 good / 17 inliers
        #
        # So this is not a question of where on the course the robot is. It
        # is whether the board can be seen at all from where the robot is
        # pointing - and a report that arrives while it is edge-on is a
        # report about something else. The rules allow signs on the course
        # that belong to no mission.
        #
        # The robot spawns at +90 (facing north, along +y).
        enabled: true
        center_deg: 180.0
        tolerance_deg: 45.0

    # --- mission 3, the construction sign ------------------------------
    # Same shape as the intersection block; the stage reads whichever of the
    # two its own name selects, so a report meant for one cannot be acted on
    # by the other. The numbers do not overlap either - construction
    # publishes 1, the arrows 2 and 3.
    construction:
      enabled: true
      window: 7
      confirm_votes: 5

      # Six seconds, against the intersection's three, because the two are
      # read under different conditions. The arrow is read while the robot
      # is driving straight at the board with it square in frame; the
      # construction board is passed side-on while the robot hugs a lane
      # line, so it is only worth looking at for a few seconds.
      #
      # Measured on a full run that failed to confirm:
      #
      #   t+0.00  4 inliers
      #   t+1.72  5 inliers
      #   t+1.84  5 inliers
      #   t+4.89  5 inliers
      #
      # Four reports over 4.9 s, and at a three second window the most that
      # were ever fresh together was three - the fourth arrived as the first
      # three were expiring, so the count could not reach five however long
      # the robot drove. It gave up at 120 s having seen the board four
      # times. Six seconds holds all four.
      #
      # The same reports confirm in 3.5 s from the mission3 preset, where
      # the robot starts parked 0.47 m in front of the board. Nothing is
      # wrong with the detector - the window was shorter than the time the
      # board spends in view.
      #
      # What it costs: a stale vote survives twice as long, so the robot
      # travels 0.42 m rather than 0.21 m at 0.07 m/s before a report stops
      # counting. Acceptable while confirm_votes is still 5 - the honest
      # alternative was lowering that, which buys the same pass by
      # believing less evidence.
      vote_max_age_s: 6.0

      # Stop where the sign was found. The debug step from while the
      # detection was being trusted. Off now that there is a stage after it.
      stop_after_detect: false
      # false (2026-10-24): the construction sign is not used at all, like
      # parking.use_sign. The boards are taken to be next once the robot has
      # faced within construction.heading (0 +/- 45) for heading_hold_s in a
      # row. On the runs of 2026-10-23 that came ~2 s before the sign was
      # confirmed (31.0-31.4 s against 32.9-33.4) and ~8 s before board 1.
      use_sign: false
      heading_hold_s: 2.0
      # Stop the moment the white line drops out (lane_state 0 or 1 for
      # white_lost_ticks ticks) on the way to the sign - to see where and
      # why with the robot standing there. Ends the run: false to score.
      stop_when_white_lost: false
      white_lost_ticks: 1
      # Instead of stopping: once white is gone for white_lost_ticks, drive
      # one fixed arc of radius_m (angular = speed / radius_m) the side's
      # way until both lines are back (lane_state 2 for back_ticks, after
      # min_s) - white alone does not count - or timeout_s is up (0 =
      # never), then follow the lane again. For 7A, where
      # the inner white line leaves the view and yellow latches onto the
      # orange board. Wins over stop_when_white_lost.
      white_lost_arc:
        enabled: true
        side: right
        # 0.22 on 2026-10-14 (was 0.25): run 1014_2304 sat ~7 cm outside the
        # lane centre round 7A. 0.14 m/s keeps the outer wheel at 0.19.
        radius_m: 0.23
        # 0.14. 0.15 tried 2026-10-25 (1025_1058, 1025_1327): no faster - the
        # arc ends where both lines come back, not after a time - and the curve
        # before construction overran to +34 deg.
        speed: 0.14
        back_ticks: 2
        # both: lane_state 2. yellow: 1 or 2 - yellow in view, white or not.
        # yellow_pair: two yellow lines a lane apart (detect_lane switched to
        # the yellow pair for the arc).
        until: both
        min_s: 0.3
        timeout_s: 0.0
        # 5B only - an arc starting within 5b_window_s of leaving the
        # junction: once odom comes round to 5b_end_heading_deg (turning
        # right, so from above), lane following takes over, both lines or
        # not. Run 1023_2123 started it at +110, had both for 0.09 s, then
        # white only, and circled until lifted. 7A, 6 s and more later,
        # keeps arcing until both (2039: 140 degrees).
        5b_window_s: 2.0
        5b_end_heading_deg: 90.0

      # The left branch's mirror (2026-10-25): there yellow is the inner
      # line. Gone for yellow_lost_ticks (lane_state 0 or 3) and the robot
      # arcs left until both lines are back. Run 1025_1337, 4B: yellow left
      # the view at +104 deg, detect_lane kept a fit beyond the image's left
      # edge and published -70 for 0.55 s - the robot stopped and jerked.
      # In that run 0/3 showed only there between the junction and the sign.
      yellow_lost_ticks: 1
      yellow_lost_arc:
        enabled: true
        side: left
        # R 0.25, the course's own radius; outer wheel 0.14 * 1.32 = 0.18.
        radius_m: 0.25
        speed: 0.14
        back_ticks: 2
        until: both
        min_s: 0.3
        # 2.0 s is 64 deg - 4B ran out near +155 in 1337, from +104.
        timeout_s: 2.0

      # Measured from the moment the junction is behind us, and the board is
      # most of the way round the course from there.
      give_up_s: 120.0

      heading:
        # The board is turned -90 degrees in the world file, exactly like the
        # arrow, so its broad faces are normal to the world x axis and it can
        # only be read while the robot is looking along x. 0 is looking
        # towards +x.
        #
        # Measured: from 0.22 to 0.45 m and from either side it matches with
        # 10 to 33 RANSAC inliers - far more strongly than the arrows, which
        # manage 4 to 17. A bold red triangle on white gives SIFT more to
        # work with than a thin white glyph on navy.
        enabled: true
        center_deg: 0.0
        tolerance_deg: 45.0

      # Threading the boards, once the sign says they are coming.
      #
      # Measured from the course texture rather than guessed: the corridor
      # through the construction zone is 0.485 m wide - two lane widths,
      # yellow at x 1.39 and white at x 1.88 - and the three boards
      # alternate which half they block:
      #
      #   barrier_1  y 0.49-0.59  spans x 1.365-1.615   left half
      #   barrier_2  y 0.95-1.05  spans x 1.620-1.870   right half
      #   barrier_3  y 1.41-1.51  spans x 1.365-1.615   left half
      #
      # So it is a slalom right, left, right - and hugging a line is already
      # how this stack drives half a corridor. Hugging white aims the
      # steering at x 1.752 against a gap centred on 1.746, and hugging
      # yellow at 1.517 against 1.506. Six and eleven millimetres, from the
      # mechanism built for the junction.
      #
      # That is why there is no avoidance controller here: detect_lane finds
      # the line, control_lane steers to it with gains already tuned on this
      # course, and this stage only chooses which line.
      avoid:
        enabled: true

        # Stop in front of the first board blocking the side being hugged,
        # instead of swapping sides and carrying on. The debug step for this
        # leg - the swap is the next piece of work.
        #
        # With this true the run ends against barrier_2, which is the point:
        # getting there at all proves the robot threaded past barrier_1 on
        # the white line.
        stop_at_obstacle: false

        # Never sit in this stage for ever. A detector that says nothing
        # looks exactly like a clear corridor from here, and the give-up
        # message says which of the two it was.
        give_up_s: 60.0

        # Swinging round a board that blocks the line being hugged.
        #
        # An arc out to swing_deg off the corridor heading and a mirrored arc
        # back. Two arcs of radius r through the same angle move the robot
        # 2r sideways and 2r forward, so one number sets both:
        #
        #   r      sideways   forward   clears barrier_2?
        #   0.06     0.120     0.120    no
        #   0.08     0.160     0.160    no
        #   0.10     0.200     0.200    yes, by 10 mm
        #   0.12     0.240     0.240    yes
        #
        # Measured need: 0.190 m sideways, inside the 0.314 m of corridor
        # between the stop point and the face of barrier_2.
        edge:
          enabled: true

          # Swing round the next board straight after the first, without
          # going back to a lane line in between.
          #
          # The run that threaded all three boards touched barrier_3: closest
          # approach zero, and it happened at yaw 15 degrees - the robot was
          # still crossing when it arrived. The delay was returning to the
          # yellow line, letting control_lane settle on it, and then waiting
          # for the LiDAR to see the next board at 0.25 m, all inside the
          # 0.36 m gap between the two boards.
          #
          # Simulated over both radii and the straight run between them,
          # with the robot's edge kept inside the yellow line at x 1.392:
          #
          #   r1    between   b2      b3     over the line
          #   0.10   0.20     hits    104    no
          #   0.10   0.30      10      55    no
          #   0.12   0.20      20      50    no          <- this
          #   0.12   0.30      49       1    no
          #   0.14   0.20      66       7    0 mm
          #   0.16   0.10      21      67    40 mm
          #
          # Millimetres. Against 8 mm and a touch, measured on the real run.
          #
          # false goes back to one swing per board, which is the general rule
          # - blocked ahead, go round to the other half - and works for any
          # number of boards anywhere. This does not: it has the second board
          # and its distance built in. The field at Daegu need not match the
          # simulator, and the rules only say the obstacles are fixed to the
          # ground, so this switch has to stay.
          double_swerve: true

          radius_m: 0.12
          second_radius_m: 0.10

          # Not optional. Coming straight back carries the robot into the
          # board's own x range while it is still alongside its 0.10 m depth,
          # which the simulation hits at any gap under 0.30 m for r1 = 0.10.
          between_m: 0.25

          # A straight run at the far end of the second swing, while the
          # robot is across the corridor pointing back at the side it came
          # from. Every centimetre here is a centimetre back towards that
          # side, bought without turning any further - and turning further
          # is what puts the outside of the arc over the lane line.
          cross_m: 0.05

          # Straight run right after the on-the-spot turn, while the robot is
          # pointing across the corridor. Turning on the spot makes no
          # sideways progress of its own, so this is where it comes from.
          out_m: 0.20

          # Turn on the spot instead of arcing round the board.
          #
          # An arc goes forward while it turns, so it spends the gap in front
          # of the board getting closer to it, and it swings the outside of
          # the robot wide. Measured over three runs, the outside went 72,
          # 190 and 323 mm past the yellow line - in a corridor 0.485 m wide.
          # Turning on the spot spends neither: the sideways move is the
          # straight run between the two turns and nothing else, so there is
          # one number to get right and it is exact.
          #
          # linear.x is zero while turning, which is not the robot having
          # stopped - 90 degrees at 0.6 rad/s takes under two seconds,
          # against the 30 the rules allow before a run is ended.
          #
          # false goes back to the arc version, which double_swerve,
          # radius_m, second_radius_m and between_m belong to.
          in_place: true
          # 1.5 for three_beat (was 0.6); slow_within_deg still eases it in.
          in_place_rate: 1.5

          # Only for the first board in the zone.
          #
          # That is the one the robot arrives at square and at speed, with
          # the least room to spare - measured at 13.4 mm of clearance with
          # an arc against 35.3 mm turning on the spot. Once it is threading,
          # the arc is quicker, and quicker matters against a 300 second
          # limit for the whole course.
          in_place_first_only: true

          # omega comes out as speed / radius = 0.40 rad/s, against 1.88 the
          # wheels can manage at this speed. The arc is 0.314 m long, so the
          # whole swing takes about 8 seconds.
          #
          # Never zero: a run that has not moved for 30 seconds is ended by
          # the rules, and turning on the spot is the easy way to trip that.
          speed: 0.04

          # 90 degrees off the corridor is the same fact as the white line
          # lying flat in the camera instead of standing upright, which is
          # the cue this behaviour was asked for. detect_lane cannot report
          # it: its sliding windows walk up from the bottom of the frame
          # fitting x as a function of y, and a flat line is not a function
          # of y - it goes quiet, which looks like losing the line for any
          # other reason. Yaw against the heading lane following had says
          # the same thing and can be measured.
          swing_deg: 90.0

          # 2026-10-12: swing to fixed odom headings instead of swing_deg off
          # whatever heading the robot had when the board was seen - a skew
          # lane following left then was carried into every turn after it.
          # Odom 0 is the way the robot faced at bringup (down the map);
          # the zone runs at +90, and the first board met while hugging
          # white is B2, gone round on the left: 180. The other swing of a
          # double swerve mirrors it, to 0. false = swing_deg as before.
          absolute: true
          corridor_heading_deg: 90.0
          swing_heading_deg: 180.0
          # Slow the on-the-spot turn over its last this-many degrees (to a
          # quarter of in_place_rate), and hold swing_heading_deg while
          # driving out. At full rate the real robot stopped at -169, 11
          # past 180: the odom it stops on and the stop itself both cross
          # Wi-Fi. 0 turns the easing off. Absolute mode only.
          slow_within_deg: 20.0
          # End the on-the-spot turn this many degrees short of
          # swing_heading_deg (2026-10-25). At in_place_rate 1.5 the robot came
          # to rest at -170.2, 10 past 180 (1025_1438); at 2.0 with 15 here,
          # -176.2 (1025_1503). The tick that gets there now stops rather than
          # sending one more turn. Absolute mode only.
          # 16 on 2026-11-01: on the 84 mm wheels 8 still swung on to
          # -170..-173, 7-10 past 180 (1031_1503, 1101_0104, 1835, 2042, 2102).
          in_place_stop_early_deg: 16.0

          # Measured over the whole seven-phase move, not one phase: it is
          # timed from entering the stage. A real run came to
          #
          #   3.8  turn on the spot
          #   3.5  out
          #   8.4  arc back
          #   8.8  straight between
          #   5.4  arc out the other way
          #   1.7  across
          #   ...  arc back
          #
          # which is 35 seconds before the last arc has finished. At 25 it
          # cut phase 6 off every time and handed back mid-turn, with a
          # warning that read like the robot was stuck when it was not.
          give_up_s: 90.0

          # Three beats instead of phases 1-6 (2026-10-13, designed in
          # docs/construction_3beat.png on curve_map's example boards):
          #   1  spin on the spot to swing_heading_deg (180, facing up)
          #   2  arc right, R arc1_radius_m, over B2 and down, to arc1_end_deg
          #   3  arc left, R arc2_radius_m, back to corridor_heading_deg (90)
          # then hug white, past B3 as well. Least gap 51 mm to B1, B2, B3
          # and both lines on paper, about 7.5 s against ~28 s. B2 seen 4 cm
          # early drops the B1 gap to 20 mm. Each arc's speed is cut so the
          # outer wheel stays inside wheel_max (0.21, see control.wheel_max).
          three_beat:
            enabled: true
            # 0.15. 0.16 tried 2026-10-25 (1025_1058, 1025_1327): 9.0-9.2 s round
            # the boards either way.
            speed: 0.15
            arc1_radius_m: 0.28
            arc1_end_deg: 30.0
            arc2_radius_m: 0.20
            wheel_max: 0.21
            half_track: 0.08
            # end each arc half a tick early - a tick past arc 1 is 3 deg, 3 cm lower
            end_lead_ticks: 0.5

    # --- mission 4, the parking sign -----------------------------------
    # Same shape as the other two sign hunts, with one condition they do not
    # have: the board only counts while detect_lane has both lines.
    #
    # Coming out of the construction zone the robot is still in a corridor
    # two lanes wide with boards standing in it, and a sign detector looking
    # at that has plenty to match against by accident. Both lines in view is
    # what says the road has gone back to an ordinary single lane, which is
    # where the parking board actually is.
    parking:
      enabled: true
      window: 7
      # 1, not 5 (2026-10-23): run 1023_1750 got three parking reports, all
      # real, in the 0.35 s the board was in view; run 1023_2034 got one, the
      # board at the edge of the frame and seen side on. Good runs that day
      # had 9-14. One report is enough to start watching for 17B - the turn
      # still waits for both lines and then the yellow line going.
      confirm_votes: 1
      # false: the parking sign is not used at all. The watch for 17B starts
      # once the robot has faced within parking.heading (180 +/- 45) for
      # heading_hold_s in a row; the turn into the lot still waits for both
      # lines and then the yellow line going. Run 1023_2047 read the board
      # zero times and drove past the lot.
      use_sign: false
      heading_hold_s: 2.0

      # Six, like the construction board and for the same reason: this one
      # is passed side-on while the robot drives, not stared at.
      vote_max_age_s: 6.0

      # Off now: the sign is no longer the end of anything, it is what sends
      # the robot on to the lot. Set it true to go back to stopping at the
      # board, which is still the quickest way to check the sign alone.
      stop_after_detect: false

      give_up_s: 120.0

      heading:
        # The board is at (0.74, 1.95) turned -90 degrees in the world file,
        # the same as the arrow and the construction board, so its broad
        # faces are normal to the world x axis and it can only be read while
        # the robot looks along x. 180 is looking towards -x.
        enabled: true
        center_deg: 180.0
        tolerance_deg: 45.0

      # Both lines in view.
      #
      # Judged from /detect/yellow_line_reliability and
      # /detect/white_line_reliability, not from lane_state. lane_state says
      # which line the steering is using, and this stage keeps hugging the
      # one the boards left the robot on - so it reads 3 by definition and
      # can never say "both", however clearly the yellow line is in frame.
      # A first run failed exactly that way: fifteen good matches of the
      # board, the heading gate open, and nothing confirmed.
      #
      # The reliabilities are worked out from both masks every frame
      # whatever follow_side says, so they stay live.
      # Off for now. Two runs never had both reliabilities up at once, and
      # the reason turned out not to be the road: measured off the texture,
      # from x 1.25 down to the board the lane is an ordinary 0.254 m wide -
      # yellow at y 1.625, white at y 1.879 - with the robot running down
      # the middle of it at y 1.744, so both lines are well inside the
      # bird's-eye view.
      #
      # It is the measure. Reliability counts rows of the frame that contain
      # the line and wants over 500 of 600, so a line that is plainly in
      # view but does not run the whole height of the frame reads zero.
      # lane_state would say it properly, but it reports which line the
      # steering is using, and this stage pins that to white.
      #
      # Turning it back on wants detect_lane to publish the pixel counts it
      # already computes, which is a publisher rather than a change of
      # algorithm - but that is a separate piece of work.
      require_both_lines: true
      # ...for this long without a break before leaving the white line for
      # the yellow one (2026-10-12). The sign is remembered once read, so the
      # two need not happen at the same moment.
      both_lines_s: 2.0
      # Once the sign is read and both lines have held both_lines_s, do not
      # turn in - carry on, and stop when the yellow line then drops out:
      # yellow reliability under min_reliability for yellow_lost_ticks ticks.
      # To see where and why with the robot standing there. Ends the run:
      # false to score.
      stop_when_yellow_lost: true
      # 2026-10-18: 2 (was 3). Run 1018_1756 took 1.1 s for yellow to drop
      # out against 0.6-0.7 s in the others, and turned in ~7 cm late.
      yellow_lost_ticks: 2
      # Instead of stopping there: turn in at 17B. pre_m straight, then a
      # left arc of radius_m (angular = speed / radius_m) until odom reads
      # end_heading_deg (-90, facing into the lot), then drive_to_lot.
      # R 0.25 from the lane centre is the arc round 17B's own centre and
      # comes out between the two yellow walls. Wins over the stop.
      left_arc:
        enabled: true
        pre_m: 0.0
        # 0.20 on 2026-10-13 (was 0.25): the arc came out too wide on the course.
        radius_m: 0.20
        # 0.14 with R 0.20: outer wheel 0.14 x 1.4 = 0.196, under 0.21
        speed: 0.14
        end_heading_deg: -90.0
        # End the arc this many degrees short of end_heading_deg (2026-10-25);
        # drive_to_lot's hold still aims at end_heading_deg. Run 1025_1407
        # ended at -88.6 and the robot came round on to -82 before the pair
        # pulled it back to -99.
        stop_early_deg: 5.0
        timeout_s: 6.0
        # then: follow the yellow pair, and lock end_heading_deg once it is
        # lost for pair_lost_ticks, or if it is not in view pair_wait_s after
        # the arc
        pair_lost_ticks: 3
        pair_wait_s: 1.0

      # Reliability counts how much of the frame a line fills and moves by 5
      # a frame, so 50 is about ten frames of having seen it - a second or
      # so at the rate detect_lane publishes.
      min_reliability: 50

    # --- the parking lot itself -----------------------------------------
    #
    # Measured off the course texture, which is an exact map of the track -
    # see notes/track_geometry.py:
    #
    #   main road      white y 1.879, yellow y 1.625
    #   yellow line    stops at x 0.631 and starts again at x 0.381
    #   pocket mouth   x 0.39 to 0.62 at y 1.008, so 0.23 m across
    #   pocket         x 0.135 to 0.877, y 0.500 to 1.008
    #   two bays       x 0.631-0.877 and x 0.135-0.381, 0.246 m each, either
    #                  side of a middle column that is the way in
    #
    # The robot is 0.138 m wide, so the mouth leaves 46 mm either side.
    #
    # Nothing marks the turn-in. traffic_pl_left, the only other board there,
    # stands at (0.50, 1.90) turned to face -y, which is the robot coming
    # back out of the pocket - it is the exit sign. The gap in the yellow
    # line is the mouth, so the gap is the cue.
    #
    # This stage steers by the yellow line, which no stage before it does.
    # The pocket is on that side: driving towards -x puts the lower y on the
    # robot's left, and the yellow line and the mouth are both over there.
    lot:
      enabled: true

      # The end of the yellow line, read off /detect/lane_state.
      #
      # lane_state and not the yellow reliability. Measured over two runs:
      # lane_state was 1 at every sample from x 1.28 all the way in, and went
      # to 0 at y 1.040 - 32 mm past the mouth at y 1.008, where the yellow
      # walls become the white dashes. The reliability cannot be used for
      # this: it collapses at x 1.0 out on the road, half a metre early,
      # because the line slides out of the rows the mask counts rather than
      # because the line stops.
      #
      # Three ticks of it, not one. detect_lane publishes at about the rate
      # mission_control ticks, so this is a third of a second - 13 mm at the
      # speed below.
      confirm_ticks: 3

      # How far to carry on after that, straight, to reach the middle of the
      # two bays.
      #
      # What it is measured from is not the mouth. lane_state went to 0 at
      # y 1.05, 1.07 and 1.089 over three runs - 40 to 80 mm BEFORE the mouth
      # at y 1.008 - because it is the yellow walls running out of the mask
      # that trips it, not the robot arriving anywhere. So the base is
      # y 1.07, and the bays' middle at y 0.754 is 0.32 from it. Checked
      # against the spread rather than the mean:
      #
      #   base 1.089  stops at y 0.789   35 mm short of the middle
      #   base 1.070            0.770   16 mm short
      #   base 1.050            0.750    4 mm past
      #
      # Turned 90 degrees into a bay the robot is 0.138 m across, so the
      # worst of those leaves 181 mm behind it and 189 mm in front, in a bay
      # 0.508 m deep.
      lead_m: 0.30

      # mission_control drives this bit itself - lane_state 0 is exactly the
      # case where detect_lane stops publishing /detect/lane, so there is
      # nothing for control_lane to steer by. Left to itself it acts on
      # whatever it was given last, which is what sent the robot wandering
      # round the pocket and back out the way it came the first time this
      # stage ran without an end.
      # 0.21 on 2026-10-13: only used holding a heading now, not steering by
      # the picture. v is cut while it corrects, so the outer wheel stays
      # inside wheel_max. Against 0.04 the stop lands ~7 cm further on: the
      # 3-tick confirm and the stop itself both run longer.
      speed: 0.21
      wheel_max: 0.21
      half_track: 0.08

      # Lane-following speed while turning off the road into the lot, until
      # the corridor heading is held; control.max_vel comes back after.
      # 2026-10-12: at the road's speed the robot ran wide of the 0.11 m
      # yellow arc at 17B and carried on up the left lane. Slower turns
      # tighter for the same steering error. 0 = leave the speed alone.
      approach_max_vel: 0.05
      # ...from this many degrees into the turn, not from the start of the
      # stage - 2026-10-12, from the start it crawled all the way to 17B.
      slow_from_deg: 10.0
      # Steer by both yellow walls of the way in (detect_lane's yellow pair)
      # until the corridor heading is held. The way out of the bay stays on
      # the left yellow line alone.
      yellow_pair: true
      # Back to full speed once both yellow walls have held this many ticks
      # in a row - lined up in the way in, the turn is done (2026-10-12).
      pair_release_ticks: 3

      # Take the wheel as soon as the robot is running straight down the
      # corridor, rather than waiting for the yellow line to end.
      #
      # Waiting cost 16 degrees, measured twice. The robot held x 0.486 on
      # -89.8 for seconds, and then over the last 0.13 m - while the line was
      # ending but before lane_state would admit it - lane following swung it
      # to -77.4 and carried it out to x 0.553. Correcting afterwards got the
      # heading back, but only after the swing had happened.
      #
      # Nothing is lost by taking it early: the corridor is straight, so lane
      # following has no work to do in it, and every steering command it
      # gives there is either noise or, at the end, wrong.
      #
      # Two conditions, because either alone is wrong. The turn says the
      # robot is in the corridor at all - the road before it is just as
      # straight, and holding a heading there would drive straight past the
      # entrance. The steadiness says the turn has finished.
      turn_in_deg: 60.0

      # Steady means the heading stayed inside this band for this many ticks.
      # The swing through the turn is tens of degrees and the corridor run
      # holds to under half a degree a second, so one second of odometry
      # tells them apart without a rate estimate - which at 10 Hz is mostly
      # noise.
      steady_ticks: 10
      steady_band_deg: 2.0

      # rad/s of correction per degree of error, and its ceiling. Holding
      # rather than recovering now, so the errors it sees are small. The
      # wheels would take 2.25 rad/s at this speed, so the cap is what limits
      # it, not them.
      kp: 0.02
      max_angular: 0.5

      # Off now: the lot is no longer the end of anything, it is where the
      # bays get read. Set it true to go back to stopping on arrival, which
      # is still the quickest way to check the approach alone.
      stop_at_end: false

      give_up_s: 60.0

    # --- which bay to park in -------------------------------------------
    #
    # Read off /detect/obstacle_side while standing still between the two of
    # them. That topic is wedges 30 degrees either side of straight left and
    # straight right against half a metre - the one piece of the 2018
    # example's detect_parking.py worth keeping. The rest of that file is
    # dead reckoning (straight 0.45, left 90, straight 1.0) and this package
    # reaches the same place by following the yellow line instead.
    #
    # Everything here is the ROBOT's left and right, never the course's. A
    # robot facing into the lot has the bay at the larger x on its left, and
    # naming these after the course is the mistake that once sent the
    # construction stage into the sign standing beside the track.
    #
    # The simulator ships both bays empty, so this can only ever be tested
    # with full.launch.py's blocked:= argument, which spawns a robot in one:
    #
    #     ros2 launch arx_mission full.launch.py start:=mission4 blocked:=right
    #
    # Measured standing in the middle column with one bay taken: 0.216 m on
    # that side against 1.821 m on the empty one, over 24 beams. Nearly a
    # factor of ten, so the 0.5 m threshold has plenty of room either way.
    bay:
      enabled: true

      # Stand still this long before reading. The robot arrives with its own
      # drift still settling and the scan costs nothing, so there is no
      # reason to act on the first one.
      # 0 on 2026-10-13: read straight away. It still waits for the first
      # side report from after the stop, ~0.1-0.3 s with the LiDAR re-armed.
      settle_s: 0.0

      # Which to take when both are empty - which in the simulator is every
      # run that does not use blocked:=. Right, like the example, which
      # tested its right first.
      prefer: right

      # Off now: choosing is no longer the end, it is what decides which way
      # to turn. Set it true to go back to stopping on the decision, which is
      # still the quickest way to check the reading alone.
      stop_after_pick: false

      give_up_s: 20.0

      # --- backing into the bay and coming out again --------------------
      #
      # Five phases, and the whole thing is one direction of turn:
      #
      #   0 turn 90 on the spot, putting the empty bay behind the robot
      #   1 reverse into it
      #   2 stand there
      #   3 drive out on a quarter circle, turning the same way again
      #   4 hold that heading until there is a line to follow
      #
      # Reversing in rather than driving in, because the robot has to leave
      # again. Nose-first it would have to reverse out blind down a column
      # 0.25 m wide; tail-first the whole exit is one forward arc, and the
      # arc that leaves the bay is the arc that lines it up with the way out.
      park:
        enabled: true

        # On the spot for the first turn. The column is 0.25 m wide and the
        # robot 0.225 m across its diagonal, so there is no room for an arc.
        turn_deg: 90.0
        # 1.5 on 2026-10-13 (was 0.6); slow_within_deg eases the end of it.
        # 2.4 on 2026-10-24 with turn_lead_s: 0.192 m/s on each wheel. 2.2
        # without the lead came to rest 25 deg past (1024_1340).
        turn_rate: 2.4
        # Phase 0 turns to an odom heading instead of through turn_deg:
        # tail to the bay, robot stopped facing -90 down the lot. Facing up
        # (180) backs into its left bay, facing down (0) into its right.
        absolute: true
        # 84 mm wheels, 2026-11-01: the turn comes to rest 17-20 deg past
        # its target every run (-5 -> +12..+15 in 1031_1503, 1101_0104,
        # 1835, 2042; turn_rate 2.0 in 2102 still +13), so the targets sit
        # 18 deg early, the way of the turn. Were 180.0 / -5.0.
        face_left_deg: -162.0
        face_right_deg: -23.0
        # 40 on 2026-10-24 (was 20): at 2.4 rad/s a 10 Hz tick is ~14 deg, so
        # 20 was barely one tick and the stop landed anywhere from -32 to -15
        # (1024_1716, 1024_1721). Slower near the end, finer steps.
        slow_within_deg: 40.0
        # Stop the turn this much early, at the rate it is turning then: /odom
        # runs ~0.1-0.15 s behind. Too far past -> raise; short -> lower.
        turn_lead_s: 0.26         # 0.26 on 2026-10-24: 0.30 came to rest at -10 and -11.4, ~32 deg after the stop at ~120 deg/s (1024_1755, 1024_1805)

        speed: 0.04
        # The reverse into the bay (0 = speed). 0.15 on 2026-10-13: the bay is
        # 0.15-0.22 m deep, ~1.5 s. Ended reverse_lead_ticks of travel early
        # (22 mm at 0.15) - odometry is a tick behind the command. If it
        # stops short of into_*_m, lower this; if it overruns, raise it.
        # 0.20 on 2026-10-24: 1024_1340 backed in straight at it.
        reverse_speed: 0.20
        reverse_lead_ticks: 1.5
        # The way out, 2026-10-13. exit_speed for the arc and the straight
        # (0 = speed); the arc is cut to keep the outer wheel inside
        # lot.wheel_max, 0.15 at R 0.248. exit_absolute: the arc ends on
        # odom exit_heading_<bay>_deg (+90, facing the way out) and the straight
        # holds it until the yellow line on the robot's LEFT is in view -
        # lane_state 1 with follow_side YELLOW, for rejoin_ticks - then follows
        # it. Not any yellow: out of the lower bay the far wall shows first.
        exit_speed: 0.21
        exit_absolute: true
        # One per bay - the left bay's arc comes round from 180, the right
        # bay's from 0. Where the arc ends and the heading the straight holds.
        exit_heading_left_deg: 95.0    # 2026-10-13 (was 90)
        exit_heading_right_deg: 85.0

        # Two distances, not one, because the robot does not stop in the
        # middle of the column: it stops at x 0.476 against a middle of
        # 0.506, four runs agreeing to 3.5 mm. The bay centres at x 0.754 and
        # x 0.258 are therefore 0.278 and 0.218 away. A single figure would
        # leave 4 mm at one end of a bay with only 68 mm to give.
        # 0.17 both on 2026-10-31 (were 0.20): the 84 mm wheels backed in too
        # deep - it coasts further at the higher speed, and the turn before it
        # ended ~18 deg past square (fixed 2026-11-01, park.face_*_deg).
        # Odom distance itself is about right: 1101_2117 lies on curve_map at
        # scale 1.00, so the 0.040-vs-0.0428 wheels.radius story told here
        # before (odom ~7% short) did not hold.
        into_left_m: 0.17      # 2026-10-13 0.20, on the real course (0.278 was the simulator)
        into_right_m: 0.18     # 0.18 on 2026-11-02 (0.19 parked 0.180 in, 1102_0042; 0.20 parked 0.196, 1102_0034). 0.20 again on 2026-11-01 (from 0.17): the right bay wanted 3 cm deeper once the turn ended square at -5 (1101_2117). 0.20 on 2026-10-24 (was 0.22). Deepest is ~4 cm past this (the robot coasts after the stop): 0.18 gave 0.216, the bay centre (1024_1755)

        # Stand still in the bay. Zero is what was asked for; the knob is
        # here because being seen stopped in it may be what actually scores.
        hold_s: 0.0

        # The quarter circle out, and it is not a free choice. From the left
        # bay's centre at (0.754, 0.754) facing -x, turning right through 90
        # degrees on this radius ends at (0.506, 1.002) facing +y - the
        # middle of the mouth, pointed up the corridor - so nothing straight
        # is needed before it or after it. The right bay is its mirror and
        # takes the same radius.
        #
        # omega is speed / radius, 0.161 rad/s, against a wheel ceiling of
        # 2.25 rad/s at this speed.
        radius_m: 0.248

        # Creep on the exit heading until detect_lane has something again,
        # then hand back to it. Without this the wheel goes back at the top
        # of the arc, where the robot is still inside the pocket and there is
        # no line for another 50 mm - and a lane follower given a frame with
        # no lane in it is what sent the robot wandering round this pocket
        # the first time.
        rejoin: true
        rejoin_ticks: 3

        # Then follow the YELLOW line until the robot is pointing back down
        # the road, and only hand to the mean of both lines there.
        #
        # Handing straight to the mean did not work. The robot came up the
        # corridor correctly to (0.469, 1.624) and then turned past 180 to
        # -139.7 and drove back down into the pocket. The corridor has a
        # yellow wall on BOTH sides and no white one, so detect_lane reports
        # lane_state 1 whichever one it locks onto, and at the top the yellow
        # it was holding curves away west - the robot followed it round and
        # went back in.
        #
        # Naming the line and the heading takes both guesses out: the yellow
        # line is what leads out of the pocket onto the road, and 180 is the
        # road. The exit arc leaves the robot on +90, so it has a 90 degree
        # left turn to make and the window has to be small enough that it
        # cannot latch part way round.
        leave_heading_deg: 180.0
        leave_tolerance_deg: 20.0

        give_up_s: 90.0

    # --- the level crossing -----------------------------------------------
    #
    # No sign to hunt. The example has a stop board at (-1.35, 1.04) and a
    # detector for it, but the bar itself is the thing that has to be obeyed
    # and it is visible from 0.60 m, which is further out than the board is
    # useful from. So: watch, creep, wait.
    #
    # Measured walking in to the bar at (-0.85, 1.26) in 5 cm steps:
    #
    #   0.85 .. 0.65 m   bar up, the resting state
    #   0.60 m           the bar comes down
    #   0.55 .. 0.35 m   down, and it holds 13.1 s
    #   0.30 m           up again
    #
    # 13.1 s is 0.91 m at this speed against 0.30 m to cover, so the robot
    # reaches the stop with about nine seconds in hand.
    level:
      # ARX: on. What reads the bar is not set here - level.source comes from
      # full.launch level_source (launcher: "mission 5 bar by"), which wins
      # over this file. Camera by default since 2026-10-25; ultrasonic and
      # both need "level ultrasonic" started on the Pi. false here leaves the
      # crossing out (skip_level:=true, its one-run switch, removed 2026-11-05).
      enabled: true

      # Only take "bar down" while facing the road the crossing is on. The
      # ultrasonic reads anything nearer than down_m as the bar, and in a
      # curve that is the wall at the side of the road. Absolute odom
      # heading, like the sign gates; 0 is the simulator's +x, the way the
      # mission5 preset faces. MEASURE THIS ON THE REAL COURSE: bring up at
      # the start line, stand the robot in front of the bar, read the yaw.
      # 2026-10-18: 0 on the real course too (odom, same frame as the other
      # gates). "crossing bar is down" logs the heading it was seen at - if
      # it reads well off 0 on the robot, move center_deg to it.
      heading:
        enabled: true
        center_deg: 0.0
        tolerance_deg: 15.0

      # Seconds in drive_to_level with no bar down before going on to the
      # tunnel anyway - the bar may be up when the robot gets there.
      # 2026-11-04: 20 (was the code's 90, which then went to follow_side and
      # never to the tunnel - 1104_2243 drove past a raised bar and round the
      # course). The bar is normally confirmed 13-14 s into this stage.
      give_up_s: 20.0

      # 2026-10-18: with the ultrasonic (level.source, set by full.launch
      # level_source) the Pi only sends the range, /detect/level_range, and
      # each stage here has its own threshold on it:
      #   drive_to_level -> approach_bar   range < slow_m, confirm_ticks in a
      #                                    row, heading in the gate above
      #   approach_bar   -> wait_bar       range <= stop_m (slowed to
      #                                    approach_max_vel on the lane)
      #   wait_bar       -> on             range > clear_m, clear_ticks in a row
      # Before, one down_m on the Pi did all three, and at 0.45 the bar post
      # beside the robot kept reading "down" after the bar had lifted.
      slow_m: 0.45
      # 0.30 on 2026-11-05 (was 0.20): stop_m went to 0.18, and standing
      # there a range wobbling past 0.20 for 5 ticks would read as lifted.
      clear_m: 0.30
      # level_source:=camera (2026-10-20): creep once the camera sees DOWN at
      # or inside camera.slow_m, stop at camera.stop_m, go on once it reads
      # UP or loses the bar (clear_ticks). Its range is k_px_m / band span -
      # an estimate; it goes blind under ~0.20 m, and blind counts as lifted.
      camera:
        # 2026-11-04: a tick counts as the bar DOWN if any frame in the last
        # down_window_s was, with its range (frames without the bar read 9.9).
        # At night detect_level saw DOWN on every other frame (1104_2236,
        # 1104_2310) and the latest-frame check never got 5 ticks in a row.
        # Used by level_source both as well (its DOWN, at any range).
        down_window_s: 0.3
        # 0.70 on 2026-10-20 (was 0.40): the run at 01:05 saw DOWN at
        # 0.59-0.66 m and only got under 0.40 at 0.16, already past the stop.
        slow_m: 0.70
        # 0.25 on 2026-10-24 (was 0.20): stopped at 0.19 the detector saw four
        # bands, called it nothing on the gap spread and the robot left with the
        # bar still down (run 1024_2343). At 0.23 it alternated 3 and 4 bands.
        # 0.30 on 2026-11-01: on the 84 mm wheels the stop at 0.24 coasted to
        # 0.199, the detector called it nothing and the robot left after 1 s
        # (run 1031_1503) - the same way out as 1024_2343.
        stop_m: 0.30
      # A range older than this does not count (Pi node stopped, Wi-Fi gap).
      range_max_age_s: 0.5

      # Ticks in a row before acting. Down is confirmed quickly because a
      # false stop costs a few seconds; clear is confirmed more slowly
      # because a false start drives into the bar.
      # 2026-10-18: 5 (was 3) - the ultrasonic's range wobbles near the bar.
      confirm_ticks: 5
      # level_source both only (2026-11-04): ticks of the camera's DOWN before
      # creeping - the ultrasonic does the distances after. Replayed on
      # tonight's runs: 2 starts the creep at 0.47-0.73 m (5: 0.29-0.51). A
      # single stray DOWN frame lasts 3 ticks in the 0.3 s window, so 2 also
      # creeps on one: 1104_2243 (bar up) would have at 0.83 m, and crept
      # max_creep_m before the ultrasonic let it go.
      both_confirm_ticks: 2

      # Leaving is decided on "anything other than down", not on "up".
      # detect_level alternates between up and nothing at close range -
      # measured, the row grouping loses a band on some frames - and both
      # mean the road is clear. Waiting for a run of UP alone stalls on that
      # flicker.
      clear_ticks: 5
      # Camera only, 2026-11-04: a lifted bar reads "nothing" (never "up"),
      # so lifted is no DOWN report for clear_quiet_s. If DOWN came fewer
      # than down_frames_sure times while waiting, the detector is not
      # reading this bar well from here - 1104_0512 said "nothing" for 13 of
      # 15 frames of a down bar at 0.29 m and left after 0.5 s - so wait
      # clear_quiet_unsure_s instead. A normal wait has ~120 DOWN reports.
      clear_quiet_s: 0.5
      clear_quiet_unsure_s: 3.0
      down_frames_sure: 15

      # Where to stand. Nearer than 0.20 m the camera has nothing to look at:
      # it sits 0.076 m ahead of the model origin, which is itself 0.038 m
      # ahead of the robot's own nose, so at 0.06 m the camera is already past
      # the bar. Checked - at 0.12 m and 0.06 m the frame has no red in it at
      # all.
      #
      # 2026-10-18: 0.10, for the HC-SR04 on the robot's front - it measures
      # from the sensor's face and is good down to a few cm. Back to 0.30 if
      # level_source is ever the camera again, which goes blind under 0.20.
      # The ultrasonic's stop. The camera has its own, camera.stop_m above.
      # 0.18 on 2026-11-05 (was 0.10), for level_source both / ultrasonic.
      stop_m: 0.18
      # ...for this many ticks in a row (ultrasonic and both; the camera
      # stops on one). 3 on 2026-10-24: run 1024_2321 stopped on a single
      # stray 0.08 with the bar still ~0.30 m away.
      stop_ticks: 3

      speed: 0.04
      # 2026-10-18: up to the bar following the lane, at no more than
      # approach_max_vel, instead of a held heading at speed (false). Stops
      # at stop_m all the same; wait_bar then holds the robot still.
      approach_follow_lane: true
      approach_max_vel: 0.10

      # A cap on the creep. /detect/level_range is only trustworthy inside
      # about 0.50 m: further out detect_level often resolves three of the
      # four bands and measures the span between the wrong two, which reads
      # as further away than it is. Two runs at the same distance gave 0.51
      # and 0.81 m for that reason. The range is what aims; this is what
      # stops a bad one running the robot into the bar.
      max_creep_m: 0.60
      # level_source both (2026-11-05): the camera may start the approach from
      # ~0.95 m (both_confirm_ticks 2), so the cap is 1.0. Lane speed until
      # the ultrasonic reads inside slow_m, approach_max_vel from there (and
      # with no ultrasonic range). Stopped by this cap instead of stop_m,
      # wait_bar goes on the camera, not on the range.
      both_max_creep_m: 1.0

      # Stop on arriving at the bar instead of waiting for it. For checking
      # the approach on its own.
      stop_at_bar: false

      # give_up_s: set near the top of this block (20, 2026-11-04). A second
      # one here (90) overrode it - yaml keeps the last - and 1104_2310 waited
      # 49 s without going on to the tunnel.

      # Under thirty seconds, deliberately: the rules end a run when the robot
      # has not moved for that long, so a bar that never lifts has to be given
      # up on before then rather than after.
      wait_give_up_s: 25.0

    # --- the tunnel --------------------------------------------------------
    #
    # Getting in is the whole of this stage; what to do once inside is not
    # built yet.
    #
    # The walls come with the course. tunnel_wall is defined inline in
    # turtlebot3_autorace_2020.world rather than through an <include>, which
    # is why searching for a model directory or for `model://` finds nothing
    # and a first pass here concluded there was no tunnel at all. Four walls,
    # 0.05 m thick and 0.25 m tall:
    #
    #   Wall_1   x -1.946   y -1.886 .. -0.086     west
    #   Wall_2   y -1.971   x -1.865 .. -0.065     south
    #   Wall_3   x -0.021   y -1.621 .. -0.084     east
    #   Wall_4   y -0.121   x -1.605 .. -0.025     north
    #
    # About 1.93 x 1.85 m enclosed, with the way in a 0.34 m gap in the north
    # side that the lane runs straight into. What the course does NOT come
    # with is a roof - full.launch.py builds one over the mouth, on by
    # default, so that the camera loses the lane inside.
    #
    # Entry is read off the LiDAR. Measured, driving in:
    #
    #   outside, y +0.60    left 1.081   right nothing
    #   outside, y +0.20    left 0.673   right nothing
    #   the mouth, y -0.10  left 0.169   right 0.120
    #   inside,  y -0.35    left 0.355   right 0.120
    #   inside,  y -0.70    left 1.106   right 0.120
    #
    # An upward range finder was asked for and would say it more directly. It
    # would also mean forking the example's robot model, its spawn launch and
    # the simulator launch that includes it, because a sensor has to live in
    # the model and gz's DetachableJoint has to be declared in the parent
    # model too. The LiDAR answers the same question with nothing forked, and
    # without depending on the light - the camera's own signal is 190 outside
    # against 90 under the roof, which works but is a brightness threshold.
    tunnel:
      enabled: true

      # The front of the tunnel is the tunnel board (sign.yaml `tunnel`),
      # seen big enough - sign.tunnel.min_width_px - while facing this way.
      # It used to be the LiDAR, something inside 0.20 m ahead; on the real
      # course the board is the clearer mark.
      #
      # Absolute odom heading, as for the other sign hunts. Measured on the
      # real course 2026-10-17: a run from mission4 (parking_17b, +180 on
      # odom - the same frame as a full run) reached the board facing -88.5.
      # +90 was tried first and threw away every report of the board.
      heading:
        enabled: true
        center_deg: -90.0
        tolerance_deg: 30.0
      # And only inside this box on /odom (metres from the start line, the
      # frame a full run's odom is in). 2026-11-03: the heading alone also
      # holds on the run down past 14A and 11A, at x -1.1, y 2.9 -> 2.15; the
      # tunnel approach is x -2.58, y 2.4 -> 1.75, the board first seen at
      # y 1.76-1.86 (runs 1102_0034 to 1103_2344, right and left). Re-check
      # on the venue's course. Presets start odom elsewhere and skip it.
      zone:
        enabled: true
        x_min: -3.2
        x_max: -2.0
        y_min: 1.0
        y_max: 3.0

      # Reports of the board needed inside vote_max_age_s.
      # 2 on 2026-11-03 (was 3). The board only counts from min_width_px
      # (~0.33 m) until it leaves the frame (~0.25 m); on the 84 mm wheels
      # that window gave 2-9 reports over twelve runs, and 1103_0208 got 2
      # and drove into the tunnel without stopping at its front.
      confirm_votes: 2
      vote_max_age_s: 3.0

      # ARX 2026-10-17: stop at the front of the tunnel for now - the run
      # ends there. The front is BOTH, in this order: the board confirmed,
      # then something within stop_ahead_m on /detect/front_range. Close
      # before the board does not count. false carries on the old way: hold
      # the heading at the board and creep in until the walls.
      stop_at_sign: true
      # true: the tunnel board is looked for. false: facing within
      # tunnel.heading (-90 +/- 30) for heading_hold_s stands in for it, then
      # the stop at stop_ahead_m - for the practice room, which has no board.
      # 2026-11-03: false - the board counted twice at best before leaving
      # the frame, and not at all in 1103_2344; the heading inside
      # tunnel.zone for heading_hold_s stands in for it.
      use_sign: false
      heading_hold_s: 1.0
      stop_ahead_m: 0.25
      stop_ahead_ticks: 2
      # Speed ceiling from the board to the stop, so a 0.15 m stop is not
      # overshot between scans.
      after_sign_max_vel: 0.08
      # ...but only from this close on /detect/front_range (0 = from the
      # board on, as before). 2026-11-03, for use_sign false.
      slow_ahead_m: 0.30

      # From the front of the tunnel to its exit on Nav2 (map/tunnel.yaml,
      # param/nav2.yaml), then stop. Needs full.launch nav:=true - the
      # default on the robot. false stops at the front as before.
      nav:
        # false on 2026-10-25: stop at the tunnel front (LiDAR <= stop_ahead_m
        # after the sign) instead of handing over to Nav2.
        # true again on 2026-11-03, to drive mission 6 through the tunnel.
        # false 2026-11-04 to map the tunnel from the stop at its front -
        # cartographer started there makes it the map's origin, start_x/y/yaw
        # 0, 0, 0 below. True again the same day on the new map
        # (tunnel_gimp.pgm); goal_x/y are still the old map's, to re-measure.
        enabled: true
        # Where the front is on the tunnel map, and which way the robot faces
        # there - map frame. Read off RViz 2026-10-17.
        start_x: 0.0
        start_y: 0.0
        start_yaw_deg: 0.0
        # The odom heading the stop is made at (measured -88.5). A stop a few
        # degrees off this hands AMCL a map heading off by the same.
        start_odom_yaw_deg: -90.0
        # The exit. 2026-10-17: was (1.8, 1.5), 0.175 m from a wall; this is
        # 0.32 m clear.
        # 2026-11-04: (1.85, 1.45), in front of the exit rather than past it
        # (was 1.85, 1.90). The doorway on tunnel_gimp.pgm is x 1.749-1.949
        # (cell edges; middle 1.849) at y 1.55-1.70, with the right wall
        # running down to y 1.30; Nav2 took it on a slant and hit a post
        # (1104_2256). From here tunnel.exit below drives straight up through it.
        # y 1.45 not 1.30 (user, same day): nearer the doorway, less room for
        # an obstacle in between. Was no turn on the spot there (nav2.yaml
        # yaw_goal_tolerance 3.14) - the right wall is close. 2026-11-06:
        # 0.26 (user), so Nav2 stops facing the exit within 15 deg - and
        # back to 3.14 the same day: RPP swung +-25 deg round it for 6 s in
        # 1106_0253. tunnel_exit does the turn. goal_yaw_deg below only
        # matters again if the tolerance is tightened.
        goal_x: 1.85
        # 2026-11-06 (user: stop nearer the exit). Nav2 counts as arrived
        # xy_goal_tolerance (0.10) short of it: y 1.33-1.36 for 1.45 in
        # 1106_0115, 0236, 0238. 1.50 with a tolerance of 0.05 stopped at
        # 1.46 but RPP stood turning at the goal for 6 s in 0253 and 0300
        # (the goal checker never took it), so 1.55 - the doorway's mouth,
        # 0.10 from both posts - with 0.10 again: stops about y 1.45.
        # 1.55 failed: in 1106_0311 Smac found no path to it 48 times (the
        # scan paints the posts into it), 99.6 s and 60 goals in the
        # tunnel. 1.50 planned every time in 0253 / 0300: stops about 1.40.
        goal_y: 1.50
        # 90 on 2026-11-04 (was 0, never enforced - nav2.yaml's
        # yaw_goal_tolerance was 3.14): the way out of the tunnel runs up the
        # map, and 1104_0543 stopped at 77 deg, still turning.
        # 80 on 2026-11-06 (user, was 90): the robot hits the left post
        # (x 1.749) often - stop turned 10 deg to the right (+x), away from
        # it. With yaw_goal_tolerance 0.26 Nav2 stops at 65-95 deg.
        goal_yaw_deg: 80.0
        start_sigma_m: 0.10
        start_sigma_deg: 10.0
        # Wait for AMCL to report the robot within localise_tol_m of the
        # front before sending the goal, re-sending the pose every 0.5 s.
        localise_s: 3.0
        localise_tol_m: 0.25
        server_wait_s: 5.0
        # 2026-11-03: the obstacles inside are re-laid on the competition day
        # (ROBOTIS), so a goal that does not arrive is tried again instead of
        # ending the run - back off backup_m, clear the costmaps, re-send.
        # attempt_s cuts a goal stuck that long against something; give_up_s
        # 0 never stops (was 60, and a failed goal stopped at once).
        give_up_s: 0.0
        attempt_s: 40.0
        backup_m: 0.10      # 0.10 on 2026-11-04 (was 0.05): in 1104_0759 goals 3 and 4 failed 1 s apart - 5 cm back was not out of the obstacle's lethal zone
        backup_speed: 0.05
        # 2026-11-06: no path from the planner (error 2xx) is not backed off:
        # clear the costmaps, hold replan_wait_s, send again in place. After
        # replan_tries of those in a row, back off once anyway (the robot may
        # sit in an obstacle's lethal zone, 1104_0759). 1106_0238 lost ~8 s
        # to four back-offs while the gap by the right wall was painted shut.
        replan_wait_s: 0.5
        replan_tries: 4
        # 2026-11-06: after replan_tries no-path in a row, move the goal down
        # the doorway line by fallback_step_m (up to fallback_max_m below
        # goal_y) instead of backing off; back off only once that is used up.
        # 1106_0311: goal at 1.55 unplannable 48 times, 99.6 s in the tunnel.
        fallback_step_m: 0.05
        fallback_max_m: 0.15
        # 2026-11-06: within arrive_m of the goal by TF (latest map pose)
        # counts as reached - mission_control cancels Nav2 and starts
        # tunnel.exit. Nav2's own goal checker sometimes disagreed with RPP
        # and RPP turned on the spot at the goal for 3.6-9 s (0253, 0300,
        # 0331). 0 leaves it to Nav2.
        arrive_m: 0.10
        # At the exit, follow the lane on (true) or stop. Nav2 not arriving
        # is retried (above), never handed back to the lane mid-tunnel.
        # 2026-10-18: stop - the run ends at the tunnel exit.
        # 2026-11-04: true tried for the lane from the exit (goal_yaw_deg 90
        # faces it) - back to false for now, stop at the exit.
        # 2026-11-04 later: true again - the exit came out facing the lane
        # (1104_2225 ends at 85 deg) with yaw_goal_tolerance 0.17.
        follow_lane_after: true

      # 2026-11-04: the second step of the way out - straight up through the
      # doorway from Nav2's goal, steering onto heading_deg on the map (held
      # on odom; Nav2 no longer turns to it), slower while still far off it,
      # until the map y reaches end_y - past the doorway's far side (1.70) by
      # more than the robot's 0.07 m half length. straight_m caps it if TF
      # is gone, max_s if it is held up. Then follow_lane_after above.
      exit:
        enabled: true
        heading_deg: 90.0
        end_y: 1.85
        straight_m: 0.70    # 0.70 on 2026-11-05 (was 0.60): the way onto the centre line is longer
        speed: 0.12
        max_s: 8.0
        # 2026-11-05: steer onto the doorway's centre line x = door_x (middle
        # of 1.749-1.949 on tunnel_gimp.pgm), aiming lookahead_m ahead on it,
        # w = kp x error (rad) up to max_angular; more than spin_deg off the aim
        # turns on the spot first. Nav2 stopped 0.08-0.14 m left of the line
        # in five runs, and holding 90 deg from there scraped the left post
        # (1104_2346, 1105_0735 out at x 1.71). Map pose from TF (AMCL).
        # Picked by replaying the six real stop poses on the map's walls:
        # lookahead 0.15 / kp 2 / spin 25 swung a corner 4.7 cm into a post,
        # 0.06 / 3 / 15 0.6 cm - the map's doorway leaves the robot 1.1 cm a
        # side even dead centre, so nothing comes out clear on paper.
        door_x: 1.85
        # 2026-11-06: within on_line_m of x = door_x, or past y door_y (the
        # doorway's mouth), aim far_lookahead_m ahead instead of lookahead_m
        # - the short aim is for getting onto the line clear of the posts,
        # but on it a 1 cm wobble in AMCL's x swung it ~10 deg and the robot
        # weaved 81-95 deg through the door (1106_0331).
        on_line_m: 0.01     # 0.02 / 0.20 simulated: weave 79-94 deg but up to 1.5 cm off the line in the doorway; 0.01 / 0.15: 0.9 cm (old 0.6)
        door_y: 1.55
        far_lookahead_m: 0.15
        lookahead_m: 0.06
        kp: 3.0
        max_angular: 0.6
        spin_deg: 15.0

      speed: 0.04

      # Both walls at once, not the right one alone.
      #
      # The right is the steadier of the two - a flat 0.120 m over sixty beams
      # from the mouth all the way to the far end, while the left falls away
      # to 1.106 m within half a metre of the entrance - but steadier is not
      # the same as particular, and on its own it accepted a sign by the road.
      # At the mouth both are there together: left 0.176, right 0.140.
      need_both: true
      #
      #   outside, y +0.60    left 1.081   right nothing
      #   outside, y +0.20    left 0.673   right nothing
      #   the mouth, y -0.10  left 0.169   right 0.120
      #   inside,  y -0.35    left 0.355   right 0.120
      #   inside,  y -0.70    left 1.106   right 0.120
      #
      # Which also says how long both-at-once lasts: about half a metre from
      # the mouth, which at 10 Hz and 0.04 m/s is a hundred ticks to confirm
      # in.
      confirm_ticks: 5

      # Stop on getting in. The debug step, like every mission before it.
      stop_after_entry: true

      give_up_s: 120.0

    # --- lane following (arx_control_lane) ------------------------------
    control:
      # Raised from the example's 0.0025. At that gain the robot had to be
      # 71% of the way from the lane centre to the line before it asked for
      # 0.5 rad/s - by which point it was already most of the way out. At
      # 0.006 that same command comes at 30%.
      #
      # In a steady curve the error is roughly constant, so the D term
      # contributes almost nothing: holding a curve is Kp's job alone.
      #
      # Ladder if this is not right: 0.004 / 0.006 / 0.008. Stop at the
      # value that starts weaving on the straights - and if it weaves,
      # lower kd rather than putting kp back.
      # Scaled with the speed: turning radius is v / (kp x error), so going
      # from 0.05 to 0.07 m/s without raising this widens every curve by the
      # same 1.4x. 0.0087 = 0.006 x (0.07 / 0.05) held the radius in the
      # simulator.
      #
      # 🔴 0.004 on the real robot, 2026-10-07 - the bottom of the ladder
      # above. At 0.0087 the term reaches the 2.0 rad/s clamp at an error of
      # 230 px, and a lane is only 595 px across, so 97 mm off centre asked
      # for everything the clamp allows. The robot can sit 56 mm off centre
      # and still be inside its lane. At 0.004 the clamp is 500 px away,
      # which is further off than the lane is wide.
      kp: 0.0040

      # A rate, not a raw frame-to-frame difference. /detect/lane arrives at
      # 1.9 Hz here - frames where the lane is lost publish nothing at all -
      # so the original `error - last_error` was a step taken over 0.53 s.
      # Times the original 0.007 that reached 2 rad/s and saturated the
      # clamp: the D term was whipping the robot rather than damping it, and
      # it outweighed P in 45 of 146 updates. Dividing by the measured dt
      # makes the gain mean the same thing at any frame rate.
      #
      # 0.0037 = 0.007 x 0.53, so behaviour at the simulator's rate was
      # unchanged.
      #
      # 🔴 "stays put when lane.frame_skip changes" is what used to be written
      # here, and it is only half true. Dividing by dt makes the gain mean the
      # same thing for a signal that is actually moving; it does nothing for
      # noise, whose amplitude does not shrink with dt. Measurement jitter of
      # a few pixels over a dt eleven times smaller is a derivative eleven
      # times larger, and that is what the real camera delivered: 21 Hz where
      # the gain was set at 1.9.
      #
      # 0.0015 on the real robot, 2026-10-07, with lane.frame_skip back to 3
      # for about 7 Hz. Together those put the D term near where it was
      # designed: (0.0015 / 0.0037) x (0.53 / 0.14) = 1.5x the original, not
      # eleven.
      #
      # 0.0023 on 2026-11-01 (was 0.003): the 84 mm wheels drive ~30% faster
      # than commanded, so the lane moves across the image ~40% faster and
      # the same kd gave a D term ~1.4x bigger. Out of the lot round 18B it
      # swung +0.55/-0.35 rad/s every ~0.45 s and the steering pulsed
      # 0 <-> 0.9 (1101_2147; 1025_1327 on the small wheels stayed smooth).
      # 0.003 / 1.3. See graph/1101_2147/18B_oscillation.png.
      kd: 0.0023 #0.003 #0.015

      # Most the published angular velocity may change between one lane
      # message and the next. The backstop for smoothness whatever the error
      # does; 0 turns it off.
      # Scaled with the speed, same reason as kp.
      #
      # 0.25 on 2026-11-01 (was 0.49), trying. Scaled by 0.2 / 0.07 at full
      # speed, 0.49 let the command move 1.4 rad/s in one message - no limit
      # at all. On the 84 mm wheels a lane message gap at the start set off
      # -1.1 / +1.3 rad/s swings and a 17 deg swerve before 1A (runs 1045,
      # 1104); 0.25 caps a step at ~0.7.
      max_angular_step: 0.49

      # kp and max_angular_step scale with the speed being driven, as
      # v / speed_ref (2026-10-12). omega = kp x error turns on a radius of
      # v / omega, so the same gain runs wider the faster the robot goes -
      # 17B and the U-turns, once max_vel went past the 0.07 the gains were
      # tuned at. 0.07 is that speed; 0 turns the scaling off.
      speed_ref: 0.07
      # Brake on the larger of the steering row's error and the one from
      # /detect/lane_ahead (lane.speed_row in lane.yaml), so a curve still
      # ahead of the near steering row slows the robot before it arrives.
      speed_from_ahead: true
      # How hard the error cuts the speed, max_vel x (1 - e/500) ^ this. The
      # original 2.2 had 100 px down to 0.61 x. 1.5 keeps 0.77 x there: with
      # speed_ref scaling the gain, the curve no longer needs the cut to stay
      # inside. Ladder 2.2 / 1.5 / 1.2, measured START -> sign with
      # intersection.stop_after_detect true (19.6 s on 2026-10-12 at 2.2,
      # max_vel 0.15, no speed_ref).
      slow_power: 1.0
      # The outer wheel runs at v + |omega| x half_track and tops out at
      # wheel_max (Burger: 0.22 m/s); v is cut to keep it there, so a turn
      # is never asked for that the wheels would round off wider. With this
      # the straights can run at the wheel limit (2026-10-13). 0 = off.
      # 2026-10-13, notes/step_test.py from rest, angular 0: 0.22 does not
      # move the robot at all, 0.21 and 0.05 do. turtlebot3_node sends
      # int(linear.x * 100) cm/s to the OpenCR, so 0.22 arrives as 22 and
      # is refused, 0.217 as 21 and is not. Every 0.22 ceiling is 0.21.
      wheel_max: 0.21
      half_track: 0.08

      # The ceiling that actually bites first. linear.x is
      #
      #     min(max_vel * (1 - |error|/500) ** 2.2, speed.max)
      #
      # so speed.max cannot lift the robot above this however high it is
      # set, and the error term holds it lower still - at 100 px of error
      # it is already down to 0.06. It was hard-coded at 0.1.
      #
      # TurtleBot3 Burger tops out at 0.22 m/s.
      #
      # /control/max_vel overrides this at run time, which is how the level
      # crossing mission is meant to slow the robot; this is the starting
      # value.
      # 2026-10-12: the ladder with speed_ref on is 0.15 / 0.18 / 0.20 -
      # stop at the last that holds 19A, 13A, 4B->7A and 12A->13A in the
      # lane. 0.15 is where the 19.6 s START -> sign was measured.
      # 0.22 is the wheel limit itself; wheel_max above keeps the curves
      # honest at it. 11.7 s START -> sign at 0.20 (2026-10-13).
      # 0.21, not 0.22: see wheel_max.
      max_vel: 0.21

    # The original control_lane hard-codes min(..., 0.05) here. Left at the
    # same value so behaviour is unchanged, but it has to be reachable: the
    # course is 16-18 m, which at 0.05 m/s is 320-360 s against a 300 s
    # limit, before any mission stops are counted.
    # Speed ceiling while a sign is hunted (drive_to_sign, construction,
    # parking). 0 = the same as everywhere. Lower this, not max_vel, if a
    # board passes before detect_sign gets 5 of 7 reports to agree.
    speed:
      sign_hunt: 0.0
      max: 0.21           # 0.22 is refused by the OpenCR - see control.wheel_max
