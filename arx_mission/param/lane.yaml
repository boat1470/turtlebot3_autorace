---
# arx_mission's detect_lane, re-keyed from /detect_lane to the wildcard so a
# namespace cannot detach it. See light.yaml.
#
# The HSV bands began as a verbatim copy of
# turtlebot3_autorace_detect/param/lane/lane.yaml. They are measurements off
# the real camera now; the reasoning is beside each one.
/**:
  ros__parameters:
    detect:
      lane:
        # ARX: measured on the real camera and the real mat, 2026-10-04, on
        # /camera/image_projected with ae=false exposure_us=8000 gain=2.0.
        # The values they replace came from the example and were written for
        # the simulator.
        #
        #   yellow   H 34-38    S 146-209   V 103-178
        #   white    H 99-107   S  67-96    V 141-205
        #   mat      H ~56      S  ~94      V  26-43   (max 43)
        #
        # Each threshold sits in the middle of the gap between the two
        # populations it has to separate.
        #
        # The white line is not white. The camera reads a sheet of white
        # paper as B=119 G=122 R=93, a quarter of the red missing, so the
        # line comes out at hue 104 - cyan - and at a saturation of 85. The
        # example's saturation_h of 70 cut it off at the first percentile.
        white:
          hue_l: 0
          hue_h: 179
          saturation_l: 0
          # 96 is the highest the line reaches, 146 the lowest the yellow
          # reaches. Anything between separates them; this is the middle.
          saturation_h: 120
          # The mat tops out at 43 and the line starts at 141, so this could
          # be anywhere in between. It is up at 120 because auto_adjust_white
          # drives it until the mask holds between 5000 and 35000 pixels, and
          # 120 lands on 30566 - inside the band, so it does not move on the
          # first frame. 90 would measure just as well and then ramp.
          lightness_l: 120
          lightness_h: 255
        yellow:
          # 34-38 measured. The example's 10-127 spanned the white line at
          # 104 as well, so the yellow mask held both lines: its centre of
          # mass came out at x 525 on a line that sits at x 199. It still
          # found the right lane_base, because that is an argmax over the
          # left half only, but every pixel of the white line was being
          # counted as yellow.
          hue_l: 20
          hue_h: 50
          saturation_l: 120
          saturation_h: 255
          # 103 is the lowest the line reaches, 43 the highest the mat
          # reaches. auto_adjust_yellow is false, so this one stays put.
          lightness_l: 75
          lightness_h: 255

    lane:
      # Left at the original's 2-in-3 drop. /camera/image_projected runs at
      # 8.78 Hz measured, so this is what puts /detect/lane at ~2.9 Hz, and
      # control_lane's D term therefore sees a real dt of 0.34 s - about
      # 1.7 cm of travel per correction at 0.05 m/s.
      #
      # 0 processes every frame and is the first thing to try when raising
      # the speed. It is a tuning change, not a fix, so it is not the
      # default: the lane tuning in this file is known to work at 3.
      # Was 3, which with an 8.78 Hz projected stream put /detect/lane at
      # 1.9 Hz - the steering was corrected less than twice a second, or
      # once every 2.6 cm of travel. 1 roughly triples that. The D term is a
      # true rate now, so raising this does not need the gains retuned.
      #
      # Costs three times the CPU in this node. Fine in simulation; measure
      # on the Pi before trusting it there.
      frame_skip: 1

      # The white and yellow mask images on /detect/image_output_sub1 and
      # sub2. In the original these exist only in calibration mode, which
      # also switches the lightness auto-adjust over - so looking at a mask
      # meant changing the behaviour being looked at.
      publish_debug_image: false

      # The original's asymmetry, preserved rather than fixed: white adjusts
      # its lightness floor when NOT calibrating, yellow adjusts when it IS.
      # Almost certainly a typo upstream, but changing it changes a tuning
      # the robot is currently driving on, so it stays until there is a run
      # to compare against.
      auto_adjust_white: true
      auto_adjust_yellow: false

      # Logged every processed frame in the original, at rosout severity
      # info. That is ~3 messages a second of network traffic on the Pi for
      # a number that /detect/lane_state already carries.
      log_lane_state: false
