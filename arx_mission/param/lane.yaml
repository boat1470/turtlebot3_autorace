---
# arx_mission's detect_lane, re-keyed from /detect_lane to the wildcard so a
# namespace cannot detach it. See light.yaml.
#
# The HSV bands began as a verbatim copy of
# turtlebot3_autorace_detect/param/lane/lane.yaml. They are measurements off
# the real camera now; the reasoning is beside each one.
/**:
  ros__parameters:
    detect:
      lane:
        # ARX: measured 2026-10-10 on /camera/image_projected, under the
        # camera defaults in arx_camera_bringup/camera.launch.py:
        # exposure_us 30000, gain 9.0 (both manual), awb off, ColourGains
        # [1.57, 1.51], sharpness 0.0 - and projection.yaml 100/13/168/105.
        # Read off a live frame, 1st to 99th percentile:
        #
        #   yellow   H 23-34    S  92-207   V  50-196
        #   white    H  any     S   7-39    V 111-174
        #   mat      H 18-66    S  39-239   V   8-63
        #
        # The set before this one (2026-10-04) was tuned with the camera
        # still on automatic gain and an exposure that camera_ros had quietly
        # reset to 20000, with no ColourGains: white paper read B=119 G=122
        # R=93, so the white line came out cyan, H 99-107 S 67-96. Locking
        # ColourGains made it neutral, and its saturation fell to 7-39 - below
        # the old saturation_l of 55, which would now drop the whole line.
        #
        # Only the edges that separate two populations are placed; an edge
        # with nothing beyond it is left wide open, so the bright part of a
        # line under a lamp is not cut off for no reason.
        white:
          # S is what separates white from yellow and from the mat; hue means
          # nothing at this little saturation, so it is not used.
          hue_l: 0
          hue_h: 179
          saturation_l: 0
          # Line up to 39, yellow from 92. Between, nearer white.
          saturation_h: 60
          # Mat up to 63, line from 111. auto_adjust_white moves this to keep
          # the mask between 5000 and 35000 pixels; 100 gave 20418 on the
          # test frame, inside the band, so it does not ramp from the start.
          lightness_l: 100
          lightness_h: 255
        yellow:
          # Line 23-34. 40 leaves room above; the mat's hues overlap this band,
          # but the mat is shut out by lightness_l.
          hue_l: 20
          hue_h: 40
          saturation_l: 120
          saturation_h: 255
          # Mat up to 63, line from about 70 at its darkest edge.
          # auto_adjust_yellow is false, so this one stays put.
          lightness_l: 71
          lightness_h: 255

    lane:
      # Half the lane, in pixels of /camera/image_projected. Used whenever
      # only one line is in view: the centre is this far from it.
      #
      # The other half of the extrinsic calibration. How wide a lane is in the
      # projected image is decided by projection.yaml - pts_dst maps the
      # trapezoid to 200..800 - so this number and that file are one
      # measurement, and re-measuring one without the other leaves them
      # disagreeing.
      #
      # 297 = half of 594.9 px, measured on the real course on 2026-10-04 with
      # top_x 39 / top_y 25 / bottom_x 121 / bottom_y 118. It replaces a
      # hardcoded 280, which was half of the simulator's lane and 17 px out
      # here.
      #
      # 17 px is 7 mm, which sounds small and is not: the two-line branch does
      # not use this number at all, it averages the two lines. So the centre
      # estimate jumped 17 px every time a line was lost or found, and a step
      # like that is a derivative of 174 px/s at 10 Hz - the D term kicked the
      # steering by 0.26 rad/s for a robot that had not moved. No pair of
      # gains smooths that away, which is why this comes before kp and kd.
      half_lane_px: 297
      # Left at the original's 2-in-3 drop. /camera/image_projected runs at
      # 8.78 Hz measured, so this is what puts /detect/lane at ~2.9 Hz, and
      # control_lane's D term therefore sees a real dt of 0.34 s - about
      # 1.7 cm of travel per correction at 0.05 m/s.
      #
      # Read the guard before this number means anything:
      #
      #     if frame_skip > 1:
      #         if self.counter % frame_skip != 0:
      #             return
      #
      # The divisor is frame_skip itself, not frame_skip + 1, and **0 and 1
      # both fall through**, so they are the same setting - every frame. A
      # note here used to say 1 roughly triples the rate over 3; it does not,
      # it multiplies it by three.
      #
      # 🔴 Back to 3 on 2026-10-07, for the real camera. /camera/image_projected
      # runs at about 21 Hz there against the simulator's 8.78, so frame_skip 1
      # was putting /detect/lane at 21 Hz against the 1.9 Hz the control gains
      # were set at - eleven times faster. kd is a true rate, which makes it
      # invariant to the sample rate for a smooth signal and emphatically not
      # for a noisy one: fixed measurement noise over a dt eleven times smaller
      # is a derivative eleven times bigger. The robot wove hard enough that
      # the speed term - linear.x falls as (1 - |error|/500)^2.2 - held it to a
      # crawl. 3 brings the loop to about 7 Hz; kd came down as well, see
      # mission.yaml.
      #
      # Costs CPU in proportion. Fine in simulation; measure on the Pi.
      frame_skip: 1

      # The white and yellow mask images on /detect/image_output_sub1 and
      # sub2. In the original these exist only in calibration mode, which
      # also switches the lightness auto-adjust over - so looking at a mask
      # meant changing the behaviour being looked at.
      publish_debug_image: true

      # The original's asymmetry, preserved rather than fixed: white adjusts
      # its lightness floor when NOT calibrating, yellow adjusts when it IS.
      # Almost certainly a typo upstream, but changing it changes a tuning
      # the robot is currently driving on, so it stays until there is a run
      # to compare against.
      auto_adjust_white: true
      auto_adjust_yellow: false

      # Logged every processed frame in the original, at rosout severity
      # info. That is ~3 messages a second of network traffic on the Pi for
      # a number that /detect/lane_state already carries.
      log_lane_state: false
